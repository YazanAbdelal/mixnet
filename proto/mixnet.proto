syntax = "proto3";

package mixnet;

option go_package = "github.com/YazanAbdelal/mixnet/proto/gen;gen";

message MessageRequest {
    bytes payload = 1;
    string next_node = 2;
}

message MessageResponse {
    bool success = 1;
}

service Messaging {
    rpc PrintMessage(MessageRequest) returns (MessageResponse);
}
