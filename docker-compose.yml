networks:
  mixnet:

services:
  server-1:
    container_name: server-1
    build:
      context: .
      dockerfile: mixnode/Dockerfile
    command: ["--type", "server", "--name", "server-1"]
    volumes:
      - ./keys/server-1-ecc-private.pem:/etc/mixnet/keys/ecc_private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/server-1.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/server-1.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
      - ./config.json:/etc/mixnet/config.json:ro
    networks:
      - mixnet

  server-2:
    container_name: server-2
    build:
      context: .
      dockerfile: mixnode/Dockerfile
    command: ["--type", "server", "--name", "server-2"]
    volumes:
      - ./keys/server-2-ecc-private.pem:/etc/mixnet/keys/ecc_private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/server-2.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/server-2.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
      - ./config.json:/etc/mixnet/config.json:ro
