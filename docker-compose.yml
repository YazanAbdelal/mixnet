networks:
  mixnet:

services:
  server-1:
    container_name: server-1
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./keys/server-1-private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/server-1.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/server-1.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
    ports:
      - "40051:50050"
    networks:
      - mixnet

  server-2:
    container_name: server-2
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./keys/server-2-private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/server-2.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/server-2.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
    ports:
      - "40052:50050"
    networks:
      - mixnet

  server-3:
    container_name: server-3
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./keys/server-3-private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/server-3.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/server-3.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
    ports:
      - "40053:50050"
    networks:
      - mixnet

  client-1:
    container_name: client-1
    build:
      context: .
      dockerfile: client/Dockerfile
    command: ["--dest", "client-2"]
    stdin_open: true
    tty: true
    volumes:
      - ./keys/client-1-private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/client-1.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/client-1.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
    depends_on:
      - server-1
      - server-2
      - server-3
    networks:
      - mixnet

  client-2:
    container_name: client-2
    build:
      context: .
      dockerfile: client/Dockerfile
    command: ["--dest", "client-1"]
    stdin_open: true
    tty: true
    volumes:
      - ./keys/client-2-private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/client-2.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/client-2.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
    depends_on:
      - server-1
      - server-2
      - server-3
    networks:
      - mixnet

