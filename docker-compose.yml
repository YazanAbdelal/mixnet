  client-1:
    container_name: client-1
    build:
      context: .
      dockerfile: mixnode/Dockerfile
    command: ["--type", "client", "--name", "client-1"]
    stdin_open: true
    tty: true
    volumes:
      - ./keys/client-1-ecc-private.pem:/etc/mixnet/keys/ecc_private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/client-1.crt:/etc/mixnet/certs/tls.crt:ro
