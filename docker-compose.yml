version: '3.8'

networks:
  mixnet:

services:
  mixnode-1:
    build:
      context: .
      dockerfile: server/Dockerfile
    volumes:
      - ./keys/server_1_private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
    ports:
      - "5001:5001"
    networks:
      - mixnet

  mixnode-2:
    build:
      context: .
      dockerfile: server/Dockerfile
    volumes:
      - ./keys/server_2_private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
    ports:
      - "5002:5002"
    networks:
      - mixnet

  mixnode-3:
    build:
      context: .
      dockerfile: server/Dockerfile
    volumes:
      - ./keys/server_3_private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
    ports:
      - "5003:5003"
    networks:
      - mixnet

  client-1:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./keys/client_1_private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
    depends_on:
    networks:
      - mixnet
      - mixnode-1
      - mixnode-2
      - mixnode-3

  client-2:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./keys/client_2_private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
    depends_on:
    networks:
      - mixnet
      - mixnode-1
      - mixnode-2
      - mixnode-3

