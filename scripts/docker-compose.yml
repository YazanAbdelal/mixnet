version: '3.8'

networks:
  mixnet:

services:
  mixnode-1:
    build:
      context: .
      dockerfile: server/Dockerfile
    volumes:
      - ./keys/server_1_private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/mixnode-1.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/mixnode-1.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
    ports:
      - "5001:5001"
    networks:
      - mixnet

  client-1:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./keys/client_1_private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/client-1.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/client-1.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
    depends_on:
    networks:
      - mixnet
      - mixnode-1

  client-2:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./keys/client_2_private.pem:/etc/mixnet/keys/private.pem:ro
      - ./keys/public:/etc/mixnet/keys/public:ro
      - ./certs/client-2.crt:/etc/mixnet/certs/tls.crt:ro
      - ./certs/client-2.key:/etc/mixnet/certs/tls.key:ro
      - ./certs/ca.crt:/etc/mixnet/certs/ca.crt:ro
    depends_on:
    networks:
      - mixnet
      - mixnode-1

